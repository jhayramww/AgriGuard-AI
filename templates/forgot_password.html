{% extends "base.html" %}

{% block title %}Reset Password - AgriGuard AI{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5" style="min-height: 80vh;">
    <div class="col-md-5">
        <div class="glass-card p-4 border-success">
            
            <div class="text-center mb-4">
                <i class="fa-solid fa-key text-success fs-1 animate-pulse mb-2"></i>
                <h2 class="fw-bold text-white mb-1">Reset Password</h2>
                <p class="text-muted small">Enter your email and a new password below to update it</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger-translucent border border-danger-translucent text-danger rounded p-3 mb-3 d-flex align-items-center">
                <i class="fa-solid fa-triangle-exclamation me-2 fs-5"></i>
                <div>{{ error }}</div>
            </div>
            {% endif %}
            
            {% if message %}
            <div class="alert alert-success-translucent border border-success-translucent text-success rounded p-3 mb-3 d-flex align-items-center">
                <i class="fa-solid fa-circle-check me-2 fs-5"></i>
                <div>{{ message }}</div>
            </div>
            {% endif %}
            
            <form action="{{ url_for('forgot_password') }}" method="POST">
                
                <div class="form-floating mb-3">
                    <input type="email" name="email" class="form-control bg-light-translucent border-translucent text-white" id="forgotEmail" placeholder="email@address.com" required>
                    <label for="forgotEmail" class="text-secondary">Email Address</label>
                </div>
                
                <div class="form-floating mb-3">
                    <input type="password" name="new_password" class="form-control bg-light-translucent border-translucent text-white" id="forgotNewPass" placeholder="Password" minlength="6" required>
                    <label for="forgotNewPass" class="text-secondary">New Password (Min. 6 chars)</label>
                </div>
                
                <div class="form-floating mb-4">
                    <input type="password" name="confirm_password" class="form-control bg-light-translucent border-translucent text-white" id="forgotConfirmPass" placeholder="Confirm Password" required>
                    <label for="forgotConfirmPass" class="text-secondary">Confirm New Password</label>
                </div>
                
                <button type="submit" class="btn btn-success w-100 py-3 rounded-pill fw-semibold btn-glow-success mb-3">
                    Update Password <i class="fa-solid fa-circle-check ms-1"></i>
                </button>
                
            </form>
            
            <div class="text-center">
                <a href="{{ url_for('login') }}" class="text-success fw-bold small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Login</a>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
